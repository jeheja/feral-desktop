name: Build All Platforms

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3-dev libxss1 libxtst6 xdg-utils libatspi2.0-0 libsecret-1-0

    - name: Install dependencies
      run: yarn install
        
    - name: Build
      run: |
        yarn build:ts
        yarn build:res
        yarn asar-webapp || true
        yarn tsx scripts/apply-feral-branding.ts apply
        yarn electron-builder --linux --x64 --arm64 --config feral-electron-builder.json

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: feral-desktop-linux
        path: |
          dist/*.deb
          dist/*.rpm
          dist/*.AppImage
          dist/*.tar.gz
        retention-days: 30

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install
        
    - name: Build
      run: |
        yarn build:ts
        yarn build:res
        yarn asar-webapp
        yarn tsx scripts/apply-feral-branding.ts apply
        yarn electron-builder --windows --x64 --arm64 --config feral-electron-builder.json

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: feral-desktop-windows
        path: |
          dist/*.exe
          dist/*.msi
        retention-days: 30

  build-macos:
    runs-on: macos-latest
    
    strategy:
      matrix:
        arch: [x64, arm64, universal]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install
        
    - name: Build
      env:
        CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
        CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      run: |
        yarn build:ts
        yarn build:res
        yarn asar-webapp || true
        yarn tsx scripts/apply-feral-branding.ts apply
        
        if [ "${{ matrix.arch }}" == "universal" ]; then
          yarn electron-builder --mac --universal --config feral-electron-builder.json
        else
          yarn electron-builder --mac --${{ matrix.arch }} --config feral-electron-builder.json
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: feral-desktop-macos-${{ matrix.arch }}
        path: |
          dist/*.dmg
          dist/*.zip
        retention-days: 30

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          feral-desktop-linux/*
          feral-desktop-windows/*
          feral-desktop-macos-*/*
        draft: false
        prerelease: false
        body: |
          # Feral Desktop Release
          
          ## Downloads
          
          ### Windows
          - `.exe` - Installer for Windows
          - `.msi` - MSI package for enterprise deployment
          
          ### macOS
          - `universal.dmg` - Works on all Mac computers
          - `arm64.dmg` - For Apple Silicon Macs (M1, M2, etc.)
          - `x64.dmg` - For Intel Macs
          
          ### Linux
          - `.deb` - For Debian/Ubuntu
          - `.rpm` - For Fedora/RHEL
          - `.AppImage` - Universal Linux package
          - `.tar.gz` - Generic archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}