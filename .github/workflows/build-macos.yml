name: Build macOS

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    strategy:
      matrix:
        include:
          - arch: x64
            name: Intel
          - arch: arm64
            name: Apple Silicon
          - arch: universal
            name: Universal

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'

    - name: Install dependencies
      run: |
        yarn install
        
    - name: Build TypeScript
      run: yarn build:ts
      
    - name: Build resources
      run: yarn build:res
      
    - name: Package webapp
      run: |
        if [ -d "webapp" ]; then
          yarn asar-webapp
        fi
        
    - name: Apply Feral branding
      run: yarn tsx scripts/apply-feral-branding.ts apply

    # Code signing setup (requires secrets to be configured)
    - name: Setup code signing
      if: ${{ github.event_name != 'pull_request' }}
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
      run: |
        # Create temporary keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        
        # Create keychain
        security create-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
        
        # Import certificate
        echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
        security import certificate.p12 -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH
        
        # Allow codesign to access keychain
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" $KEYCHAIN_PATH

    - name: Build macOS app
      env:
        CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
        CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        if [ "${{ matrix.arch }}" == "universal" ]; then
          yarn electron-builder --mac --universal --config feral-electron-builder.json
        else
          yarn electron-builder --mac --${{ matrix.arch }} --config feral-electron-builder.json
        fi

    - name: Notarize macOS app
      if: ${{ github.event_name != 'pull_request' && matrix.arch != 'universal' }}
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        # Find the DMG file
        DMG_FILE=$(find dist -name "*.dmg" -type f | head -1)
        
        if [ -n "$DMG_FILE" ]; then
          echo "Notarizing $DMG_FILE..."
          
          # Submit for notarization
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
            
          # Staple the notarization ticket
          xcrun stapler staple "$DMG_FILE"
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: feral-desktop-macos-${{ matrix.arch }}
        path: |
          dist/*.dmg
          dist/*.zip
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.dmg
          dist/*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job to test the builds
  test:
    needs: build
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: feral-desktop-macos-${{ matrix.arch }}
        
    - name: Test DMG mounting
      run: |
        DMG_FILE=$(find . -name "*.dmg" -type f | head -1)
        if [ -n "$DMG_FILE" ]; then
          echo "Testing $DMG_FILE..."
          hdiutil attach "$DMG_FILE" -nobrowse
          ls /Volumes/
          hdiutil detach /Volumes/Feral* || true
        fi

    - name: Verify code signing
      run: |
        DMG_FILE=$(find . -name "*.dmg" -type f | head -1)
        if [ -n "$DMG_FILE" ]; then
          echo "Verifying code signing for $DMG_FILE..."
          spctl -a -t open --context context:primary-signature -v "$DMG_FILE"
        fi