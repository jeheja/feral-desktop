# Nginx configuration to restrict Feral to desktop app only

server {
    listen 443 ssl http2;
    server_name app.feralisme.fr;

    # SSL configuration
    ssl_certificate /path/to/certificate.crt;
    ssl_certificate_key /path/to/private.key;

    # Check for desktop app header or user agent
    set $is_desktop 0;
    
    # Check custom header (most secure)
    if ($http_x_feral_desktop_auth ~* "feral-desktop-") {
        set $is_desktop 1;
    }
    
    # Fallback: check user agent
    if ($http_user_agent ~* "Electron") {
        set $is_desktop 1;
    }

    # Block non-desktop access
    location / {
        if ($is_desktop = 0) {
            return 302 https://feralisme.fr/download-desktop;
        }

        # Normal proxy settings for your Matrix/Element web app
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Allow access to static download page
    location /download-desktop {
        root /var/www/feral-static;
        try_files /download.html =404;
    }
}